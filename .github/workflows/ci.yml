name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant. Pushes
# to main keep running to completion so its history stays fully checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Backstops the local commit-msg hook for clones that skipped the root
  # npm install. Lints every PR commit plus the PR title, which becomes
  # the squash-merge commit message. The title travels through an env var,
  # never expression interpolation into the script (see spec-drift-watch).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install commit tooling
        run: npm ci
      - name: Lint PR commit messages
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint PR title (squash commit message)
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Repo sanity checks
        run: node scripts/check.mjs
      - name: Bridge package install
        working-directory: packages/webmcp-bridge
        run: npm ci
      - name: Bridge package lint
        working-directory: packages/webmcp-bridge
        run: npm run lint
      # Lint and build both miss test-file type errors: eslint doesn't
      # typecheck, and tsconfig.build.json only covers src/.
      - name: Bridge package typecheck (src + tests)
        working-directory: packages/webmcp-bridge
        run: npm run typecheck
      - name: Bridge package build
        working-directory: packages/webmcp-bridge
        run: npm run build
      - name: Bridge package tests
        working-directory: packages/webmcp-bridge
        run: npm test
      # Proves the tarball npm would publish contains every entry point
      # package.json `exports` promises — an unbuilt dist publishes silently.
      - name: Verify publishable tarball
        working-directory: packages/webmcp-bridge
        run: npm run verify:pack
      - name: webmcp-verify install
        working-directory: packages/webmcp-verify
        run: npm ci
      - name: webmcp-verify lint
        working-directory: packages/webmcp-verify
        run: npm run lint
      - name: webmcp-verify typecheck (src + tests)
        working-directory: packages/webmcp-verify
        run: npm run typecheck
      - name: webmcp-verify build
        working-directory: packages/webmcp-verify
        run: npm run build
      - name: webmcp-verify tests
        working-directory: packages/webmcp-verify
        run: npm test

  # Aggregate gate: branch protection on `main` requires a single status
  # check named `ci`. commitlint may be skipped (push events); check may not.
  ci:
    runs-on: ubuntu-latest
    needs: [commitlint, check]
    if: always()
    steps:
      - name: Verify every required job passed
        env:
          RESULTS: commitlint=${{ needs.commitlint.result }} check=${{ needs.check.result }}
        run: |
          echo "$RESULTS"
          if [ "${{ needs.check.result }}" != "success" ]; then exit 1; fi
          case "${{ needs.commitlint.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          echo "All required checks passed."
