name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo sanity checks
        run: node scripts/check.mjs
      - name: Bridge package install
        working-directory: packages/webmcp-bridge
        run: npm ci
      - name: Bridge package lint
        working-directory: packages/webmcp-bridge
        run: npm run lint
      - name: Bridge package build
        working-directory: packages/webmcp-bridge
        run: npm run build
      - name: Bridge package tests
        working-directory: packages/webmcp-bridge
        run: npm test
