name: Evals

# Runs the plugin eval suite (evals/) with `claude plugin eval`. Costs real
# API tokens, so it runs on demand and on PRs that touch skills or evals,
# and skips cleanly when the ANTHROPIC_API_KEY secret is absent (forks).
# Requires eval early access on the account that owns the key.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - ".claude-plugin/**"

permissions:
  contents: read

jobs:
  plugin-evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Note when skipping
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret not set; skipping plugin evals"
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          claude plugin eval . \
            --allow-tools Bash Write Edit \
            --scaffold \
            --no-publish \
            --threshold 0.6 \
            --max-cost-usd 15 \
            --json eval-result.json
      - name: Upload results
        if: env.ANTHROPIC_API_KEY != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval-result.json
            evals/results/
          if-no-files-found: ignore
