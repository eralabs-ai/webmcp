version: 2

updates:
  # Root package: commit tooling only (commitlint, husky) — all dev, so
  # routine bumps group into one reviewable PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The published bridge package. Runtime deps (@modelcontextprotocol/sdk)
  # stay individual PRs; dev bumps group.
  - package-ecosystem: npm
    directory: "/packages/webmcp-bridge"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # eslint and @eslint/js peer-depend on each other across majors; bumping
      # one without the other breaks npm ci, so majors ship as one PR.
      eslint-major:
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - "@typescript-eslint/*"
        update-types:
          - major
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint does not yet accept TS 7 as a peer; majors here
      # break npm ci until the ecosystem catches up.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The published verify CLI package. Same policy as the bridge.
  - package-ecosystem: npm
    directory: "/packages/webmcp-verify"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      eslint-major:
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - "@typescript-eslint/*"
        update-types:
          - major
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Keeps the SHA-pinned actions in .github/workflows current. Pinning without
  # this is how a workflow quietly rots on an unmaintained action version.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
